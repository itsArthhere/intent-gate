name: Verify experiment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute full notebook including training and evaluation
        run: python -m nbconvert --to notebook --execute notebooks/01_intent_gate.ipynb --output ci_executed.ipynb --output-dir /tmp --ExecutePreprocessor.timeout=600
      - name: Unit and Streamlit integration tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q intent_gate scripts streamlit_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence
          path: |
            outputs/
            /tmp/ci_executed.ipynb
